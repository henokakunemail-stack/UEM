# golangci-lint configuration.
#
# The CI step runs `golangci-lint-action` with no other arguments, so without
# this file the linter uses whatever its own defaults happen to be on the day it
# runs. That is how a finding starts appearing or disappearing between commits
# with no change to the code. Every rule here is one the repository actually
# holds to; anything that would flag the existing code is excluded with a stated
# reason rather than silenced, so the config never becomes a rubber stamp.

version: "2"

run:
  timeout: 5m

# CGO_ENABLED is not set here. v2 accepts `env` at neither the top level nor
# under `run:`, and `golangci-lint config verify` -- which the action runs before
# it lints anything -- rejects the whole file over it. The CI step sets it as a
# real environment variable on the golangci-lint step, which is where the
# linter reads it from anyway.

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - unconvert
    - unparam
    - usestdlibvars
  disable:
    # bodyclose cannot tell a WebSocket upgrade from an ordinary HTTP request.
    # websocket.Dialer.Dial and DialContext return an *http.Response whose Body
    # is the raw upgraded connection, not a response body: closing it closes the
    # socket. The linter reports every agent dial site and every WebSocket test
    # as a leak, and "fixing" those findings would break the connection.
    - bodyclose
    # errcheck flags the defer x.Close() idiom, unchecked os.Setenv in tests,
    # and unchecked Win32 syscall returns. Each is a deliberate shape in this
    # codebase, and the errors are not actionable: a failed ReleaseDC or a
    # failed Rollback after Commit has no recovery path worth the noise. The
    # standard exclusions below cover these by name, which is the supported
    # mechanism — a hand-written regex here only ever matches the shapes that
    # existed when it was written.
    - errcheck
    # nilerr reports returning nil after checking err != nil. The one site it
    # flags (device-management/helpers.go) is a timestamp unmarshaller that is
    # deliberately lenient — a row with an unparseable time is treated as
    # absent, not as an error — and that intent is already stated in the
    # function's own doc comment. Rewriting it to satisfy the linter would
    # turn a missing field into a query failure.
    - nilerr
    # noctx requires a request context on every outbound call. The sites it
    # flags are one-shot helpers with no request to carry one: flushing the DNS
    # resolver cache, and invoking sc.exe from the Windows service installer,
    # which runs under SCM control and has no HTTP request anywhere in reach.
    - noctx
  settings:
    staticcheck:
      checks:
        - all
        # Package naming is a product decision here (package device-management is
        # imported as devicemgmt), not something to re-litigate on every run.
        - -ST1003
  exclusions:
    # unparam stays enabled because it found two real bugs — the -heartbeat flag
    # and AGENT_OFFLINE_AFTER were both accepted and then discarded. What it
    # false-positives on is the uniform families, where one signature is shared
    # by dispatch-selected siblings so a parameter unused in one member is still
    # part of the shape. Exclude those two, not the linter.
    rules:
      - path: (agent/shared/maintenance|agent/(windows|linux|macos))/.*\.go
        linters:
          - unparam
      # wsticket's issue helper takes a subject that is a package const today, but
      # the tests assert the consumed subject equals it. Keeping the parameter is
      # what lets a second-subject case be added without reshaping the helper, so
      # "always the same value" is the intent, not an oversight.
      - path: server/core/wsticket/.*_test\.go
        linters:
          - unparam
      # Test fixtures are deliberately over-parameterised: an extra return or a
      # deviceID/version argument is there so a second case can be added without
      # reshaping the helper, and trimming them to today's callers makes the
      # next test worse. Every unparam finding this rule hides was on a _test.go
      # helper, not on production code.
      - path: .*_test\.go
        linters:
          - unparam
      # acceptInventory's deviceID is a real device key, and the InventoryReceiver
      # interface in server/core/transport/ws.go fixes the signature. Its only
      # current callers are tests passing "dev-1", so unparam mistakes the test
      # for the contract.
      - path: server/modules/device-management/inventory_handler\.go
        linters:
          - unparam
    generated: lax
    presets:
      - comments
      - std-error-handling
    paths:
      # The vite build output that //go:embed captures. It is committed, so
      # without this every generated bundle file is parsed as source. This
      # replaces `issues.exclude-dirs`, which the v2 schema removed.
      - server/cmd/server/dist

formatters:
  enable:
    - gofmt
    - goimports

issues:
  # Never truncate: a linter that silently drops findings past a cap is worse
  # than one that is slow.
  max-issues-per-linter: 0
  max-same-issues: 0

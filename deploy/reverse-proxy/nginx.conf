# Production Reverse Proxy Configuration for Enterprise Endpoint Manager
# Supports REST API, Embedded Single-Binary SPA, and Persistent WebSocket Connections.

events {
    worker_connections 2048;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Upstream backend pool (supports sticky sessions via ip_hash for multi-node deployments)
    upstream endpoint_backend {
        ip_hash;
        server 127.0.0.1:8443 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTP to HTTPS Redirection
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME challenge for Let's Encrypt / Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main HTTPS & WSS Server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # SSL Configuration
        ssl_certificate     /etc/ssl/certs/endpoint-mgmt.crt;
        ssl_certificate_key /etc/ssl/private/endpoint-mgmt.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Max payload for large package uploads and agent binary rollouts
        client_max_body_size 500M;
        client_body_buffer_size 128k;

        # General REST API and Web Console SPA
        location / {
            proxy_pass http://endpoint_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # Long-lived Bidirectional WebSocket Channels:
        # - /api/agent/connect                 (agent management transport)
        # - /api/devices/{id}/terminal/ws      (remote interactive VT100 shell)
        # - /api/devices/{id}/remotecontrol/ws (screen capture & desktop relay)
        location ~* ^/api/(agent/connect|devices/.*/terminal/ws|devices/.*/remotecontrol/ws|agent/devices/.*/remotecontrol/ws) {
            proxy_pass http://endpoint_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Persistent connection: 24-hour read/send timeout, disable buffering
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Health & Readiness probes for Load Balancer / Kubernetes
        location ~ ^/(healthz|readyz) {
            proxy_pass http://endpoint_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }
    }
}

name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Cross-Platform Release Assets
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web-console/package-lock.json

      - name: Build Web Console
        shell: pwsh
        run: |
          Set-Location web-console
          npm ci
          npm run build
          Set-Location ..

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress

      - name: Compile Windows & Linux Binaries
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (-not $ver -or $ver -notmatch '^v\d') {
            $ver = "${{ inputs.tag_name }}"
          }
          if (-not $ver) { $ver = "v1.0.0" }
          $cleanVer = $ver.TrimStart('v')

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          Write-Host "Building for version: $cleanVer"

          # 1. Server Linux amd64
          $env:CGO_ENABLED = "0"
          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          go build -ldflags "-s -w -X main.serverVersion=$cleanVer" -o dist/server-linux-amd64 ./server/cmd/server

          # 2. Agent Linux amd64
          go build -ldflags "-s -w -X github.com/henokakunemail-stack/Endpoint-Manager/agent/shared/osinfo.Version=$cleanVer" -o dist/agent-linux-amd64 ./agent/cmd/agent
          $env:GOARCH = "arm64"
          go build -ldflags "-s -w -X github.com/henokakunemail-stack/Endpoint-Manager/agent/shared/osinfo.Version=$cleanVer" -o dist/agent-linux-arm64 ./agent/cmd/agent
          $env:GOARCH = "amd64"

          # 3. Server Windows amd64
          $env:GOOS = "windows"
          go build -ldflags "-s -w -X main.serverVersion=$cleanVer" -o dist/server-windows-amd64.exe ./server/cmd/server

          # 4. Agent Windows amd64
          go build -ldflags "-s -w -X github.com/henokakunemail-stack/Endpoint-Manager/agent/shared/osinfo.Version=$cleanVer" -o dist/agent-windows-amd64.exe ./agent/cmd/agent

          # 5. Build NSIS Windows Installers & Uninstallers
          Copy-Item dist/agent-windows-amd64.exe ./agent-windows-amd64.exe -Force
          Copy-Item dist/server-windows-amd64.exe ./server-windows-amd64.exe -Force
          & powershell.exe -ExecutionPolicy Bypass -File .\packaging\windows\build.ps1 -Version $cleanVer
          & powershell.exe -ExecutionPolicy Bypass -File .\packaging\windows\build-server.ps1 -Version $cleanVer

          $parts = $cleanVer -split '\.'
          $numeric = [int[]]@()
          foreach ($p in $parts) {
            if ($p -match '^\d+$') { $numeric += [int]$p }
          }
          while ($numeric.Count -lt 4) { $numeric += 0 }
          $versionNum = ($numeric[0..3] -join '.')

          # choco does not put NSIS on this step's PATH; build.ps1 finds it the
          # same way, which is why the setup installers built and this failed.
          $nsis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $nsis) { $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          Push-Location packaging\windows
          try {
            & $nsis /DVERSION=$cleanVer /DVERSION_NUM=$versionNum agent-uninstall.nsi
            if ($LASTEXITCODE -ne 0) { throw "makensis agent-uninstall.nsi failed" }
            & $nsis /DVERSION=$cleanVer /DVERSION_NUM=$versionNum server-uninstall.nsi
            if ($LASTEXITCODE -ne 0) { throw "makensis server-uninstall.nsi failed" }
          } finally {
            Pop-Location
          }

          if (Test-Path "packaging\windows\EndpointAgent-Setup.exe") {
            Copy-Item "packaging\windows\EndpointAgent-Setup.exe" dist/EndpointAgent-Setup.exe -Force
          }
          if (Test-Path "packaging\windows\EndpointAgent-Uninstall.exe") {
            Copy-Item "packaging\windows\EndpointAgent-Uninstall.exe" dist/EndpointAgent-Uninstall.exe -Force
          }
          if (Test-Path "packaging\windows\EndpointServer-Setup.exe") {
            Copy-Item "packaging\windows\EndpointServer-Setup.exe" dist/EndpointServer-Setup.exe -Force
          }
          if (Test-Path "packaging\windows\EndpointServer-Uninstall.exe") {
            Copy-Item "packaging\windows\EndpointServer-Uninstall.exe" dist/EndpointServer-Uninstall.exe -Force
          }

          # 6. Tarball for Linux server updater
          # agents/ carries the Linux agents the one-line installer hands out.
          New-Item -ItemType Directory -Force -Path dist/agents | Out-Null
          Copy-Item dist/agent-linux-amd64, dist/agent-linux-arm64 dist/agents -Force
          tar -czf dist/endpoint-server-linux-amd64.tar.gz -C dist server-linux-amd64 agents
          Remove-Item dist/agents -Recurse -Force

          # 7. SHA256 checksums so operators can verify assets pre-deploy.
          $hashes = Get-ChildItem dist -File | ForEach-Object {
            $h = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $hashes | Set-Content -Encoding ASCII dist/checksums.txt

          Get-ChildItem dist/ | Select-Object Name, Length

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ -z "$TAG" || ! "$TAG" =~ ^v ]]; then
            TAG="${{ inputs.tag_name }}"
          fi
          if [[ -z "$TAG" ]]; then TAG="v1.0.0"; fi

          echo "Publishing release for $TAG..."

          gh release create "$TAG" dist/* \
            --title "Enterprise Endpoint Management $TAG" \
            --notes "Automated release $TAG with cross-platform server and agent installers." \
            --draft=false \
            --prerelease=false || \
          gh release upload "$TAG" dist/* --clobber

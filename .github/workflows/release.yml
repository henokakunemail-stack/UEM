name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    # Windows, because the NSIS installers are built here. Every other asset is
    # a cross-compile or an archive, which scripts/build-release.ps1 produces on
    # any host -- it is the same script scripts/publish-release.ps1 runs.
    name: Build Cross-Platform Release Assets
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if (-not $ver -or $ver -notmatch '^v\d') {
            $ver = "${{ inputs.tag_name }}"
          }
          if (-not $ver) { $ver = "v1.0.0" }
          "tag=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$($ver.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web-console/package-lock.json

      - name: Install NSIS
        run: |
          choco install nsis -y --no-progress

      - name: Build release assets
        shell: pwsh
        run: |
          # choco does not put NSIS on this step's PATH; build-release.ps1
          # looks in the default install directories as well.
          ./scripts/build-release.ps1 -Version "${{ steps.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  macos-pkg:
    # pkgbuild and productbuild exist only on macOS. The package is built from
    # the agents the build job already compiled and stamped, so it carries the
    # same bytes as agent-darwin-* and the server's agents/ bundle.
    name: Build macOS Agent Package
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Build EndpointAgent-macOS.pkg
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p pkg-out
          AGENT_DARWIN_ARM64="$PWD/dist/agent-darwin-arm64" \
          AGENT_DARWIN_AMD64="$PWD/dist/agent-darwin-amd64" \
          PKG_OUTPUT="$PWD/pkg-out/EndpointAgent-macOS.pkg" \
            bash packaging/darwin/build.sh

      - name: Check the package
        run: |
          pkgutil --payload-files pkg-out/EndpointAgent-macOS.pkg | tee payload.txt
          grep -q 'usr/local/bin/endpoint-agent$' payload.txt
          grep -q 'usr/local/bin/endpoint-agent-uninstall$' payload.txt
          pkgutil --expand-full pkg-out/EndpointAgent-macOS.pkg expanded
          # The universal binary must carry both slices, and the scripts must
          # be executable or Installer skips them.
          lipo -info expanded/*.pkg/Payload/usr/local/bin/endpoint-agent | tee lipo.txt
          grep -q arm64 lipo.txt && grep -q x86_64 lipo.txt
          test -x expanded/*.pkg/Scripts/postinstall

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: pkg-out/EndpointAgent-macOS.pkg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build, macos-pkg]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: macos-pkg
          path: dist

      - name: Regenerate checksums
        # The build job's checksums.txt predates the macOS package; this one
        # covers every asset that is published.
        working-directory: dist
        run: |
          rm -f checksums.txt
          sha256sum -- * | sort -k2 > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          echo "Publishing release for $TAG..."
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "Enterprise Endpoint Management $TAG" \
            --notes "Automated release $TAG with server and agent installers for Windows, Linux and macOS." \
            --draft=false \
            --prerelease=false || \
          gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber
